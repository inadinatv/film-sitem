name: Botu Calistir
on:
  schedule:
    # Her gece 03:00 - hizli tarama (yeni filmler)
    - cron: '0 3 * * *'
    # Her Pazar 04:00 - derin tarama (tum arsiv, gozden kacanlar icin)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mod:
        description: 'Bot modu (normal: hizli tarama, derin: tam arsiv taramasi, tamir: bozuk kayit onarimi)'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - derin
          - tamir
# Aynı anda iki tarama movies.json üzerinde yarışmasın.
concurrency:
  group: film-bot-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP Kurulumu
        uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - name: PHP syntax kontrolu
        run: php -l bot.php
      - name: Botu calistir
        run: php bot.php "${{ github.event.inputs.mod || (github.event.schedule == '0 4 * * 0' && 'derin' || 'normal') }}"
      - name: Github'a Kaydet
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Film Botu"
          git add movies.json
          git commit -m "Filmler guncellendi" || echo "Degisiklik yok"
          # Workflow basladiktan sonra main degistiyse commit'i guncel dala tasi.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
