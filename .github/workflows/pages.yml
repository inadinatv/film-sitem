name: GitHub Pages'e yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: GitHub Pages'i ayarla
        uses: actions/configure-pages@v5

      - name: Statik dosyalari paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages'e aktar
        id: deployment
        uses: actions/deploy-pages@v4
