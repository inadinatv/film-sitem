<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnadına TV - Film Kuşağı</title>
    <meta name="description" content="İnadına TV Film Kuşağı: Türkçe dublaj ve altyazılı binlerce filmi HD kalitesinde izle. En yeni eklenen filmler her gün güncellenir.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e50914; --primary-hover: #ff5e62; --bg: #0b0b0b; --card-bg: #1a1a1a; --text: #ffffff; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
        }

        /* Üst Menü / Header */
        header {
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17,17,17,0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .logo {
            font-weight: 800;
            font-size: 22px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo i {
            -webkit-text-fill-color: var(--primary);
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper i {
            position: absolute;
            left: 12px;
            color: #aaa;
            pointer-events: none;
            font-size: 14px;
            z-index: 2;
        }

        .search-box {
            width: 38px;
            height: 38px;
            border-radius: 19px;
            background: rgba(255,255,255,0.1);
            border: none;
            outline: none;
            color: white;
            padding: 5px 15px 5px 35px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s;
            font-family: inherit;
            cursor: pointer;
        }

        .search-box::placeholder { color: transparent; transition: color 0.3s; }

        .search-box:focus, .search-box:not(:placeholder-shown) {
            width: 220px;
            background: #222;
            cursor: text;
        }

        .search-box:focus::placeholder, .search-box:not(:placeholder-shown)::placeholder {
            color: #888;
        }

        .menu-btn { font-size: 24px; cursor: pointer; color: white; transition: color 0.3s;}
        .menu-btn:hover { color: var(--primary); }

        /* Yan Menü (Kategoriler) */
        .sidebar {
            position: fixed;
            right: -290px;
            top: 0;
            width: 260px;
            height: 100%;
            background: #111;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            padding: 20px;
            box-shadow: -5px 0 20px rgba(0,0,0,0.8);
            overflow-y: auto;
        }

        .sidebar.active { right: 0; }

        .sidebar-close {
            text-align: right;
            font-size: 28px;
            cursor: pointer;
            margin-bottom: 10px;
            color: #888;
            transition: color 0.2s;
        }
        .sidebar-close:hover { color: var(--primary); }

        .sidebar h2 {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 18px;
        }

        .cat-item {
            display: flex;
            align-items: center;
            padding: 12px;
            color: #ccc;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 14px;
            transition: 0.2s;
        }

        .cat-item i { width: 25px; text-align: center; margin-right: 5px; font-size: 16px; opacity: 0.8; }
        .cat-item:hover, .cat-item.active { background: var(--primary); color: white; }
        .cat-item:hover i, .cat-item.active i { opacity: 1; }

        .cat-item .cat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .cat-count {
            font-size: 10px;
            font-weight: 600;
            background: rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 2px 8px;
            margin-left: 8px;
            color: #ddd;
        }
        .cat-item.active .cat-count, .cat-item:hover .cat-count { background: rgba(0,0,0,0.3); color: #fff; }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Menü acikken arkayi karartan katman */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1500;
        }
        .overlay.active { display: block; }

        /* Durum cubugu */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 5% 0;
            font-size: 13px;
            color: #999;
        }
        .status-bar .active-cat { color: #fff; font-weight: 600; }
        .status-bar .live-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--primary);
            margin-right: 6px;
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.6); }
            70%  { box-shadow: 0 0 0 8px rgba(229, 9, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }

        /* Film Tablosu (Grid) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px 5% 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4); }
        .card img { width: 100%; height: 230px; object-fit: cover; display: block; background: #222; }

        .card .meta { padding: 8px 10px 10px; }
        .card h3 {
            font-size: 13px;
            margin: 0;
            text-align: center;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6em;
            line-height: 1.3;
        }
        .card .sub {
            text-align: center;
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            backdrop-filter: blur(2px);
            z-index: 2;
        }
        .badge.new {
            background: linear-gradient(90deg, var(--primary), var(--primary-hover));
            color: #fff;
            box-shadow: 0 2px 8px rgba(229, 9, 20, 0.5);
        }
        .badge.new i { margin-right: 3px; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            padding: 60px 20px;
        }
        .empty-state i { font-size: 40px; margin-bottom: 15px; color: #444; display: block; }

        .load-more {
            display: block;
            margin: 20px auto 40px;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.3s;
        }
        .load-more:hover { background: var(--primary-hover); transform: scale(1.05); }

        footer {
            text-align: center;
            padding: 25px 15px 35px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #1c1c1c;
        }
        footer .logo-mini {
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* MODAL (ARKAPLAN KAPLAMALI) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background-color: #111;
            background-size: cover !important;
            background-position: center !important;
            padding: 25px 20px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            min-height: 450px;
            text-align: center;
            position: relative;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* İçeriği aşağı iter */
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Resmin üzerini hafif karartmak için */
        .modal-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #0b0b0b 10%, rgba(11,11,11,0.8) 45%, rgba(11,11,11,0.2) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .modal-inner {
            position: relative;
            z-index: 2; /* Karartmanın üstünde durması için */
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transition: 0.2s;
            z-index: 3;
        }
        .close-modal:hover { color: var(--primary); }

        #mTitle {
            margin: 0 0 5px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            font-size: 24px;
        }

        #mInfo {
            color: #ff5e62;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        #mDesc {
            font-size: 13px;
            color: #eee;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); /* Cam efekti */
            -webkit-backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 12px;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            line-height: 1.5;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .lang-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 150px;
            padding-right: 5px;
        }

        .play-btn {
            background: rgba(229, 9, 20, 0.9);
            backdrop-filter: blur(5px);
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .play-btn:hover { background: var(--primary); transform: translateY(-2px); }

        #mDesc::-webkit-scrollbar, .lang-group::-webkit-scrollbar { width: 5px; }
        #mDesc::-webkit-scrollbar-thumb, .lang-group::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        /* MOBİL UYUMLULUK (3 SÜTUN OTOMATİK AYAR) */
        @media (max-width: 600px) {
            header { padding: 12px 15px; }
            .logo { font-size: 18px; }
            .logo i { font-size: 20px; }

            .search-box:focus, .search-box:not(:placeholder-shown) { width: 150px; }

            .status-bar { padding: 12px 12px 0; font-size: 12px; }

            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 12px 10px 15px;
            }
            .card { border-radius: 8px; }
            .card img { height: 145px; }
            .card .meta { padding: 6px 5px 8px; }
            .card h3 { font-size: 10px; -webkit-line-clamp: 2; min-height: 2.6em; }
            .card .sub { font-size: 8px; margin-top: 2px; }
            .badge { font-size: 8px; padding: 3px 5px; top: 5px; left: 5px; }

            #mTitle { font-size: 20px; }
            .modal-content { min-height: 400px; }
        }

        @media (max-width: 380px) {
            .search-box:focus, .search-box:not(:placeholder-shown) { width: 120px; }
            .card img { height: 130px; }
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo" onclick="setCat('Tümü'); return false;"><i class="fas fa-play-circle"></i> İNADINA TV</a>
    <div class="header-actions">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" class="search-box" placeholder="Film ara..." autocomplete="off">
        </div>
        <div class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></div>
    </div>
</header>

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-close" id="sidebarClose">&times;</div>
    <h2>Kategoriler</h2>
    <div id="catList"></div>
</div>

<div class="status-bar">
    <span><span class="live-dot"></span><span class="active-cat" id="statusCat">Tümü</span></span>
    <span id="statusCount"></span>
</div>

<div class="grid" id="movieGrid"></div>
<button id="loadMoreBtn" class="load-more">DAHA FAZLA GÖSTER</button>

<footer>
    <span class="logo-mini">İNADINA TV</span> · Film Kuşağı — Katalog her gün otomatik olarak güncellenir.<br>
    Tüm içerikler filmmodu.one kaynağından derlenmektedir.
</footer>

<div id="movieModal" class="modal">
    <div class="modal-content" id="modalContent">
        <span class="close-modal" id="modalClose">&times;</span>

        <div class="modal-inner">
            <h2 id="mTitle"></h2>
            <div id="mInfo"></div>
            <div id="mDesc"></div>
            <div id="langButtons" class="lang-group"></div>
        </div>
    </div>
</div>

<script>
    let all = [], filtered = [], limit = 24, activeCat = 'Tümü', maxPoster = 0;
    const byId = new Map();

    const NEW_CAT = 'Yeni Eklenenler';

    // Kategorilerin ekranda gorunme sirasi (filmmodu menusuyle uyumlu)
    const catOrder = [
        'Türkçe Dublaj', 'Altyazılı Filmler', '4K', 'Aile', 'Aksiyon', 'Animasyon',
        'Belgesel', 'Bilim-Kurgu', 'Dram', 'Fantastik', 'Gerilim', 'Gizem',
        'Hint Filmleri', 'Kısa Film', 'Komedi', 'Korku', 'Kült Filmler', 'Macera',
        'Müzik', 'Oscar Ödüllü Filmler', 'Romantik', 'Savaş', 'Stand Up', 'Suç',
        'Tarih', 'Tavsiye Filmler', 'TV filmi', 'Vahşi Batı'
    ];

    // Poster numarasi: filmmodu her filmi artan numarayla kaydeder,
    // yani numara ne kadar buyukse film o kadar yeni eklenmistir.
    function posterNum(img) {
        const m = /\/poster\/(\d+)\//.exec(img || '');
        return m ? parseInt(m[1], 10) : 0;
    }

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function isNew(m) {
        if (m.added) {
            const t = new Date(m.added).getTime();
            if (!isNaN(t)) return (Date.now() - t) < 30 * 24 * 3600 * 1000; // son 30 gun
        }
        return m._num > 0 && m._num > maxPoster - 40; // son eklenen 40 poster
    }

    // 1. Verileri Baslat
    async function init() {
        try {
            const res = await fetch('movies.json');
            all = await res.json();
        } catch(e) {
            document.getElementById('movieGrid').innerHTML =
                "<div class='empty-state'><i class='fas fa-film'></i>Film listesi yuklenemedi.<br>Lutfen botu calistirip verileri cekin.</div>";
            return;
        }

        all.forEach(m => { m._num = posterNum(m.image); byId.set(m.id, m); });
        maxPoster = all.reduce((mx, m) => Math.max(mx, m._num), 0);
        all.forEach(m => { m._new = isNew(m); });

        // EN YENI EKLENEN FILM HER ZAMAN EN USTTE (filmmodu ile ayni mantik)
        all.sort((a, b) => (b._num - a._num) || String(b.added || '').localeCompare(String(a.added || '')));

        renderCats();
        applyFilter();
    }

    // Kategoriler icin ikon secici
    function getCatIcon(cat) {
        const lower = cat.toLowerCase();
        if (lower.includes('yeni eklenen')) return 'fa-bolt';
        if (lower.includes('dublaj')) return 'fa-microphone';
        if (lower.includes('altyaz')) return 'fa-closed-captioning';
        if (lower.includes('4k')) return 'fa-tv';
        if (lower.includes('aile')) return 'fa-users';
        if (lower.includes('aksiyon')) return 'fa-fighter-jet';
        if (lower.includes('animasyon')) return 'fa-snowman';
        if (lower.includes('belgesel')) return 'fa-video';
        if (lower.includes('bilim')) return 'fa-rocket';
        if (lower.includes('dram')) return 'fa-theater-masks';
        if (lower.includes('fantastik')) return 'fa-dragon';
        if (lower.includes('gerilim')) return 'fa-heartbeat';
        if (lower.includes('gizem')) return 'fa-user-secret';
        if (lower.includes('hint')) return 'fa-om';
        if (lower.includes('kısa') || lower.includes('kisa')) return 'fa-stopwatch';
        if (lower.includes('komedi')) return 'fa-laugh-squint';
        if (lower.includes('korku')) return 'fa-ghost';
        if (lower.includes('kült') || lower.includes('kult')) return 'fa-gem';
        if (lower.includes('macera')) return 'fa-map-marked-alt';
        if (lower.includes('müzik') || lower.includes('muzik')) return 'fa-music';
        if (lower.includes('oscar') || lower.includes('ödül') || lower.includes('odul')) return 'fa-award';
        if (lower.includes('romantik')) return 'fa-heart';
        if (lower.includes('savaş') || lower.includes('savas')) return 'fa-bomb';
        if (lower.includes('stand')) return 'fa-microphone-lines';
        if (lower.includes('suç') || lower.includes('suc')) return 'fa-gavel';
        if (lower.includes('tarih')) return 'fa-monument';
        if (lower.includes('tavsiye')) return 'fa-thumbs-up';
        if (lower.includes('tv')) return 'fa-clapperboard';
        if (lower.includes('vahşi') || lower.includes('vahsi')) return 'fa-hat-cowboy';
        if (lower.includes('tümü') || lower.includes('tum')) return 'fa-list-ul';
        return 'fa-film'; // Varsayilan
    }

    // 2. Kategori listesini GERCEK VERIDEN uret (bos kategori gosterilmez)
    function renderCats() {
        const counts = {};
        let newCount = 0;
        all.forEach(m => {
            counts[m.category] = (counts[m.category] || 0) + 1;
            if (m._new) newCount++;
        });

        const ordered = catOrder.filter(c => counts[c]);
        const extras = Object.keys(counts)
            .filter(c => !catOrder.includes(c))
            .sort((a, b) => a.localeCompare(b, 'tr'));

        const items = [
            { name: 'Tümü', count: all.length },
            { name: NEW_CAT, count: newCount },
            ...[...ordered, ...extras].map(c => ({ name: c, count: counts[c] }))
        ];

        document.getElementById('catList').innerHTML = items.map(c =>
            `<a href="#" class="cat-item ${c.name === activeCat ? 'active' : ''}" data-cat="${esc(c.name)}">
                <i class="fas ${getCatIcon(c.name)}"></i>
                <span class="cat-name">${esc(c.name)}</span>
                <span class="cat-count">${c.count}</span>
            </a>`
        ).join('');
    }

    // 3. Filmleri Ekrana Ciz
    function render() {
        const grid = document.getElementById('movieGrid');
        const items = filtered.slice(0, limit);

        if (items.length === 0) {
            grid.innerHTML = "<div class='empty-state'><i class='fas fa-search'></i>Aramana uygun film bulunamadı.</div>";
        } else {
            grid.innerHTML = items.map(m => `
                <div class="card" data-id="${esc(m.id)}">
                    ${m._new ? '<span class="badge new"><i class="fas fa-bolt"></i>YENİ</span>' : ''}
                    <img src="${esc(m.image)}" loading="lazy" alt="${esc(m.title)}">
                    <div class="meta">
                        <h3>${esc(m.title)}</h3>
                        <div class="sub">${esc(m.year)} • ${esc(m.category)}</div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('loadMoreBtn').style.display = limit >= filtered.length ? 'none' : 'block';
        document.getElementById('statusCat').innerText = activeCat;
        document.getElementById('statusCount').innerText =
            filtered.length + ' film listeleniyor · toplam ' + all.length + ' film';
    }

    // 4. Arama ve Filtreleme
    function applyFilter() {
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        filtered = all.filter(m => {
            if (activeCat === NEW_CAT && !m._new) return false;
            if (activeCat !== 'Tümü' && activeCat !== NEW_CAT && m.category !== activeCat) return false;
            return !term || m.title.toLowerCase().includes(term);
        });
        limit = 24;
        render();
    }

    function setCat(c) {
        activeCat = c;
        toggleSidebar(false);
        renderCats();
        applyFilter();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loadMore() { limit += 24; render(); }

    // Yan menu ac/kapa
    function toggleSidebar(force) {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        const willOpen = force !== undefined ? force : !sb.classList.contains('active');
        sb.classList.toggle('active', willOpen);
        ov.classList.toggle('active', willOpen);
    }

    // 5. Afiş yuklenemezse yerlestirme resmi goster
    const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="230">
            <rect width="100%" height="100%" fill="#1f1f1f"/>
            <g fill="none" stroke="#444" stroke-width="4"><rect x="45" y="70" width="70" height="55" rx="6"/></g>
            <circle cx="80" cy="97" r="12" fill="none" stroke="#444" stroke-width="4"/>
            <text x="50%" y="165" fill="#555" font-family="sans-serif" font-size="12" text-anchor="middle">Afiş yok</text>
        </svg>`
    );
    document.getElementById('movieGrid').addEventListener('error', e => {
        if (e.target.tagName === 'IMG' && !e.target.dataset.fallback) {
            e.target.dataset.fallback = '1';
            e.target.src = PLACEHOLDER;
        }
    }, true);

    // 6. Detay Penceresi (guvenli: film verileri bellekten okunur)
    async function openModal(id) {
        const movie = byId.get(id);
        if (!movie) return;

        document.getElementById('mTitle').innerText = movie.title;
        document.getElementById('mInfo').innerText = `${movie.year} • ${movie.category}` + (movie._new ? ' • YENİ' : '');
        document.getElementById('modalContent').style.backgroundImage = `url('${movie.image}')`;
        document.getElementById('mDesc').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Bilgiler ve dil seçenekleri aranıyor...';
        document.getElementById('langButtons').innerHTML = '';
        document.getElementById('movieModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';

        const btnBox = document.getElementById('langButtons');
        try {
            const res = await fetch(`/api/info?id=${encodeURIComponent(id)}`);
            if (res.status === 404) {
                document.getElementById('mDesc').innerHTML = '<span style="color:#ff5e62;"><i class="fas fa-exclamation-circle"></i> Bu film kaynak siteden kaldırılmış veya içerik bulunmuyor.</span>';
                btnBox.innerHTML = '';
                return;
            }
            const data = await res.json();
            if (data.exists === false || (!data.languages || data.languages.length === 0)) {
                document.getElementById('mDesc').innerHTML = `<span style="color:#ffaa00;"><i class="fas fa-info-circle"></i> ${esc(data.message || 'Bu filmin izlenebilir video kaynağı bulunamadı.')}</span>`;
                btnBox.innerHTML = '';
                return;
            }

            document.getElementById('mDesc').innerText = data.desc || 'Film açıklaması bulunamadı.';

            if (data.languages && data.languages.length > 0) {
                data.languages.forEach(l => {
                    const icon = l.name.toLowerCase().includes('altyaz') ? 'fa-comment-dots' : 'fa-microphone-alt';
                    const a = document.createElement('a');
                    a.href = l.url;
                    a.target = '_blank';
                    a.className = 'play-btn';
                    a.innerHTML = `<i class="fas ${icon}"></i> ${esc(l.name.toUpperCase())}`;
                    btnBox.appendChild(a);
                });
            } else {
                btnBox.innerHTML = `<a href="/api/play?id=${encodeURIComponent(id)}" target="_blank" class="play-btn"><i class="fas fa-play"></i> FİLMİ OYNAT</a>`;
            }
        } catch(e) {
            document.getElementById('mDesc').innerText =
                'Detaylar şu an alınamadı. Yine de aşağıdan izlemeyi deneyebilirsin.';
            btnBox.innerHTML = `
                <a href="/api/play?id=${encodeURIComponent(id)}&lang=tr" target="_blank" class="play-btn"><i class="fas fa-microphone-alt"></i> TÜRKÇE DUBLAJ</a>
                <a href="/api/play?id=${encodeURIComponent(id)}&lang=en" target="_blank" class="play-btn"><i class="fas fa-comment-dots"></i> TÜRKÇE ALTYAZILI</a>`;
        }
    }

    function closeModal() {
        document.getElementById('movieModal').style.display = 'none';
        document.body.style.overflow = '';
    }

    /* ---------------- Olay baglantilari ---------------- */

    document.getElementById('searchInput').addEventListener('keyup', applyFilter);
    document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
    document.getElementById('menuBtn').addEventListener('click', () => toggleSidebar());
    document.getElementById('sidebarClose').addEventListener('click', () => toggleSidebar(false));
    document.getElementById('overlay').addEventListener('click', () => toggleSidebar(false));
    document.getElementById('modalClose').addEventListener('click', closeModal);

    document.getElementById('catList').addEventListener('click', e => {
        const item = e.target.closest('.cat-item');
        if (item) { e.preventDefault(); setCat(item.dataset.cat); }
    });

    document.getElementById('movieGrid').addEventListener('click', e => {
        const card = e.target.closest('.card');
        if (card) openModal(card.dataset.id);
    });

    document.getElementById('movieModal').addEventListener('click', e => {
        if (e.target.id === 'movieModal') closeModal();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeModal(); toggleSidebar(false); }
    });

    init();
</script>
</body>
</html>
